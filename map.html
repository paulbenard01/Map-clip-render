<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Heritle Map Renderer</title>
<link rel="stylesheet" href="/styles/overlay.css" />
<script src="/node_modules/d3-array/dist/d3-array.js"></script>
<script src="/node_modules/d3-geo/dist/d3-geo.js"></script>
<script src="/lib/equal-earth-map.js"></script>
<script src="/lib/scene-engine.js"></script>
<script src="/lib/scene-view.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #map { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="map"></div>
<div id="overlay">
  <svg id="routeSvg"></svg>
</div>

<script>
/**
 * The page render.js screenshots, one frame at a time.
 *
 * Everything about *how* a scene looks lives in lib/scene-view.js and
 * lib/scene-engine.js, shared with the builder. This file is only the
 * headless harness around them: load, wait, expose __setFrame.
 */
(function () {
  const params = new URLSearchParams(location.search);
  const scenePath = params.get("scene");
  const styleName = params.get("style") || "dark-navy";

  let stage;

  async function main() {
    // The CLI points the page at a scene file on the local server; the
    // builder's Render button injects the scene it has in memory instead,
    // so an unsaved scene can be rendered without writing a temp file.
    const presets = await fetch("/styles/presets.json").then((r) => r.json());
    const scene = window.__SCENE_JSON
      ? JSON.parse(window.__SCENE_JSON)
      : await fetch(scenePath).then((r) => r.json());
    const preset = presets[styleName] || presets["dark-navy"];
    const normalized = SceneEngine.normalizeScene(scene);

    document.body.style.background = preset.background;

    const first = SceneEngine.cameraAt(normalized, 0);
    const map = new EqualEarthMap({
      container: "map",
      style: {
        version: 8,
        sources: {},
        layers: [{ id: "bg", type: "background", paint: { "background-color": preset.background } }],
      },
      center: first.center,
      zoom: first.zoom,
      bearing: first.bearing,
      pitch: first.pitch,
      interactive: false,
      attributionControl: false,
      fadeDuration: 0,
      preserveDrawingBuffer: true,
    });
    window.__map = map;

    await new Promise((resolve) => map.on("load", resolve));

    const [land, countries, graticule] = await Promise.all([
      fetch("/data/land.geo.json").then((r) => r.json()),
      fetch("/data/countries.geo.json").then((r) => r.json()),
      fetch("/data/graticule.geo.json").then((r) => r.json()),
    ]);

    // Used automatically whenever it's been built locally (npm run
    // build-terrain) — no per-scene flag. Silently absent otherwise, since
    // most people won't have run that opt-in step.
    const terrain = await fetch("/data/terrain/bounds.json")
      .then((r) => (r.ok ? r.json() : null))
      .then((b) => (b ? { url: "/data/terrain/relief.jpg", coordinates: b.coordinates } : null))
      .catch(() => null);

    SceneView.installBasemap(map, preset, { land, countries, graticule, terrain, terrainOpacity: normalized.terrainOpacity });

    stage = SceneView.createStage({
      map,
      overlay: document.getElementById("overlay"),
      routeSvg: document.getElementById("routeSvg"),
      preset,
      scene: normalized,
    });

    // Paint frame 0 before declaring ready, then wait for the map to settle.
    //
    // Both waits matter. Pin photos need to be decoded or the first frames
    // render with missing images; the country polygons need a rasterisation
    // pass or the opening frames come out as bare land silhouettes with no
    // country fills or highlights at all. (That second one was a real bug in
    // v1 — the first ~0.25s of every clip was missing the country layer.)
    stage.setFrame(0);

    await Promise.all(Array.from(document.images).map((img) =>
      img.complete ? Promise.resolve() : new Promise((r) => { img.onload = img.onerror = r; })
    ));
    await waitForIdle(map, 10000);

    window.__duration = SceneEngine.computeDuration(normalized);
    window.__ready = true;
  }

  // Resolves once the map has finished rendering everything it knows about
  // (in particular, an async-loaded terrain raster). Falls back on a
  // timeout so a scene can never hang the render outright.
  function waitForIdle(map, timeoutMs) {
    return new Promise((resolve) => {
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      const timer = setTimeout(finish, timeoutMs);
      map.once("idle", () => { clearTimeout(timer); finish(); });
    });
  }

  // Called once per frame from Node via page.evaluate. Deterministic: jumps
  // straight to the interpolated state for time t, with no reliance on
  // real-time animation, so every frame lands exactly on-beat regardless of
  // how fast this machine is.
  window.__setFrame = function (t) { stage.setFrame(t); };

  window.__init = main();
})();
</script>
</body>
</html>
